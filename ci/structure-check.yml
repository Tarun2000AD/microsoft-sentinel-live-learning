name: structure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Every step has a README, no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every NN-* folder has a README.md
        shell: bash
        run: |
          fail=0
          for d in [0-9][0-9]-*/; do
            if [ ! -f "${d}README.md" ]; then
              echo "::error::${d} has no README.md"
              fail=1
            fi
          done
          exit $fail

      - name: Steps are numbered 00..62 with no gaps
        shell: bash
        run: |
          got=$(ls -d [0-9][0-9]-*/ | sed -E 's/^([0-9]{2}).*/\1/' | sort -n | tr '\n' ' ')
          want=$(seq -w 0 62 | tr '\n' ' ')
          if [ "$got" != "$want" ]; then
            echo "::error::step numbering has a gap or duplicate"
            echo "got:  $got"
            echo "want: $want"
            exit 1
          fi
          echo "00..62 present"

      - name: No secrets committed
        shell: bash
        run: |
          if grep -rInE '(BEGIN (RSA|PRIVATE) KEY|AccountKey=|SharedAccessSignature=|client_secret=|sig=[A-Za-z0-9%]{20,}|logic.azure.com:443/workflows/[a-f0-9]{16,})' \
              --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::possible secret or Logic App callback URL committed"
            exit 1
          fi
          echo "clean"
